# Resolve the backend by name on every request window instead of once at startup.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=on;

# Link-preview crawlers do not run JavaScript, so give them a server-rendered page with
# per-profile OpenGraph tags (WhatsApp, Facebook, X, LinkedIn, Telegram, Slack, Discord).
map $http_user_agent $is_link_crawler {
  default 0;
  "~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot)" 1;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A variable in proxy_pass makes nginx re-resolve; the request URI is forwarded unchanged.
  set $backend http://${BACKEND_UPSTREAM};

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /health {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /ready {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location ~ ^/freelancers/([A-Za-z0-9-]+)$ {
    if ($is_link_crawler) {
      rewrite ^/freelancers/(.*)$ /api/share/freelancers/$1 break;
      proxy_pass $backend;
    }
    try_files $uri /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
