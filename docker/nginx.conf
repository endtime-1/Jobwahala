# Resolve the backend by name on every request window instead of once at startup.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=on;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A variable in proxy_pass makes nginx re-resolve; the request URI is forwarded unchanged.
  set $backend http://${BACKEND_UPSTREAM};

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /health {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /ready {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
