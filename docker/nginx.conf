# Resolve the backend by name on every request window instead of once at startup.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=on;

# Link-preview and search crawlers may not run JavaScript, so they get a server-rendered page with
# real content and OpenGraph tags (WhatsApp, Facebook, X, LinkedIn, Telegram, Slack, Discord,
# Google, Bing and others). People always get the app.
map $http_user_agent $is_link_crawler {
  default 0;
  "~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Googlebot|bingbot|DuckDuckBot|YandexBot|Baiduspider|Applebot)" 1;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A variable in proxy_pass makes nginx re-resolve; the request URI is forwarded unchanged.
  set $backend http://${BACKEND_UPSTREAM};

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Search engines ask for /sitemap.xml on the main site; the API builds it from the live jobs.
  location = /sitemap.xml {
    proxy_pass $backend/api/share/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /ready {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location ~ ^/freelancers/([A-Za-z0-9-]+)$ {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^/freelancers/(.*)$ /api/share/freelancers/$1 break;
      proxy_pass $backend;
    }
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location = / {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/pages/home break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /jobs {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/pages/jobs break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # Search landing pages: /jobs-in-accra, /banking-jobs, /banking-jobs-in-accra, /jobs-by-location ...
  # Crawlers get the server-rendered page (which also says noindex for thin pages); people get the app.
  location ~ ^/(?<landing_slug>jobs-by-location|jobs-by-category|jobs-in-[a-z0-9-]+|[a-z0-9-]+-jobs|[a-z0-9-]+-jobs-in-[a-z0-9-]+)$ {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/seo/$landing_slug break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # Courses: the hub, category pages, "[skill] courses in Ghana" pages and each course. Crawlers get server-rendered pages.
  location = /courses {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/course-pages/hub break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location ~ ^/courses/category/(?<course_category>[a-z0-9-]+)$ {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/course-pages/category/$course_category break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location ~ ^/courses/(?<course_slug>[a-z0-9-]+)$ {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/course/$course_slug break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location ~ ^/(?<course_skill>[a-z0-9-]+)-courses-in-ghana$ {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/course-pages/skill/$course_skill break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /internships {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^ /api/share/pages/internships break;
      proxy_pass $backend;
    }
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location ~ ^/jobs-in/([a-z-]+)$ {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^/jobs-in/(.*)$ /api/share/pages/jobs-in/$1 break;
      proxy_pass $backend;
    }
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  location ~ ^/jobs/([A-Za-z0-9-]+)$ {
    proxy_set_header X-Forwarded-Host $host;
    if ($is_link_crawler) {
      rewrite ^/jobs/(.*)$ /api/share/jobs/$1 break;
      proxy_pass $backend;
    }
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }

  # Build files have unique names, so they can be cached forever. A file that no longer exists must
  # be a real 404: answering with index.html makes an old tab fail with a confusing "wrong MIME type".
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # These decide which release people get, so browsers must always re-check them.
  location ~ ^/(sw\.js|registerSW\.js|workbox-[A-Za-z0-9_-]+\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
